name: Rust CI

on:
  push:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
    steps:
      - name: Free up disk space
        uses: BitcreditProtocol/.github/.github/actions/free-disk-space@6de4960af50d86d1d76a813b27a9a700a68da7c8 # v1.0.0

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust
        run: rustup update stable

      - name: Add rustup components
        run: rustup component add clippy rustfmt

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Activate cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "bcr-common"

      - name: Install required cargo tools
        run: cargo install cargo-deny clippy-sarif sarif-fmt

      - name: Check
        run: cargo check --verbose --all-features

      - name: Check for WASM
        run: cargo check --verbose --target wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run:
          cargo clippy --verbose --all-features --message-format=json | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Cargo deny
        run: cargo deny check
        continue-on-error: true


      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        continue-on-error: true
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true
