[package]
name = "bcr-common"
version = "0.10.0"
edition = "2024"
license = "MIT"

[features]
default = ["wallet"]
test-utils = []
wallet = ["cashu/wallet", "cdk-common/wallet" ]
mint = ["cashu/mint", "cdk-common/mint"]
clwdr-client = ["dep:async-nats", "dep:bytes", "dep:frost-secp256k1-tr"]
webpki-roots = ["dep:webpki-root-certs", "reqwest/rustls"]

[dependencies]
async-nats = {version = "0.50", optional = true}
bip39 = {version = "2.2"}
bitcoin = {version = "0.32", features = ["serde"]}
secp256k1 = { version = "0.29", features = ["global-context"] } # needed for global-context of bitcoin::secp256k1 - in bitcoin 0.33 there will be a feature flag for this
borsh = {version = "1.5", features = ["derive"]}
bytes = {version = "1", optional = true}
cashu = {version = "=0.16.0", features = ["swagger"]}
cdk-common = {version = "=0.16.0"}
ciborium = {version="0.2"}
frost-secp256k1-tr = { version = "3.0.0", features = ["serde"], optional = true }
infer = {version="0.22"}
nostr = {version = "0.45"}
rand = {version = "0.8"}
reqwest = {version = "0.13", default-features = false, features = ["json", "rustls", "query"]}
serde = {version = "1.0"}
serde_json = {version = "1.0"}
serde_repr = {version = "0.1"}
strum = {version = "0.28", features = ["derive"]}
thiserror = {version = "2.0"}
time = {version = "0.3", features = ["serde", "formatting", "parsing", "macros"]}
tracing = {version = "0.1"}
url = {version = "2.5"}
utoipa = {version = "5.5", features = ["time", "uuid", "url"]}
uuid = {version = "1", features = ["serde"]}
webpki-root-certs = {version = "1", optional = true}

[dev-dependencies]
bcr-common = {path = ".", features = ["test-utils"]}
mockito = {version = "1.7"}
tokio = {version = "1"}
